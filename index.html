<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEKA v8.5: Mega Cybernetic Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-purple: #a855f7;
            --neon-emerald: #10b981;
            --neon-blue: #3b82f6;
            --neon-red: #ef4444;
            --neon-cyan: #06b6d4;
            --dark-glass: rgba(11, 15, 25, 0.85);
            --darker-glass: rgba(5, 8, 15, 0.95);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 100%, 100%, 20px 20px, 20px 20px;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .orbitron-font { font-family: 'Orbitron', sans-serif; }
        .terminal-font { font-family: 'Share Tech Mono', monospace; }
        
        .glass-panel {
            background: linear-gradient(145deg, var(--dark-glass), var(--darker-glass));
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .holo-base {
            width: 250px; height: 40px;
            background: radial-gradient(ellipse at center, rgba(6, 182, 212, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.2);
            animation: holoPulse 3s infinite alternate;
            z-index: 0; pointer-events: none;
        }
        @keyframes holoPulse { 100% { opacity: 0.5; transform: translateX(-50%) scale(0.9); } }

        .glitch-effect { animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 1px) }
            40% { transform: translate(-1px, -2px) }
            60% { transform: translate(2px, 1px) }
            80% { transform: translate(1px, -1px) }
            100% { transform: translate(0) }
        }

        .shake-effect { animation: shake 0.2s cubic-bezier(.25, .46, .45, .94) both infinite; }
        @keyframes shake {
            0% { transform: translate(0) }
            25% { transform: translate(-3px, 2px) }
            50% { transform: translate(3px, -2px) }
            75% { transform: translate(-2px, -3px) }
            100% { transform: translate(0) }
        }

        .shake-hard { animation: shakeHard 0.1s infinite; }
        @keyframes shakeHard {
            0% { transform: translate(0) }
            25% { transform: translate(-10px, 10px) }
            50% { transform: translate(10px, -10px) }
            75% { transform: translate(-10px, -10px) }
            100% { transform: translate(0) }
        }

        .head-perspective { perspective: 1500px; width: 100%; height: 100%; position: relative; }
        .head-inner { width: 100%; height: 100%; position: relative; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .head-inner.flipped { transform: rotateY(180deg); }
        .head-front, .head-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; }
        .head-back { transform: rotateY(180deg); background: #0d1511; border-radius: 2.5rem; border: 6px solid #334155; box-shadow: inset 0 0 50px #000; overflow: hidden; }
        
        .fan-blade { transform-origin: center; animation: spin-fast 0.5s linear infinite; }
        @keyframes spin-fast { 100% { transform: rotate(360deg); } }
        .led-blink { animation: blinker 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate; }
        @keyframes blinker { 100% { opacity: 0.2; box-shadow: none; } }

        .party-mode { animation: rgbParty 0.5s linear infinite; }
        @keyframes rgbParty {
            0% { box-shadow: 0 0 25px #ff0000, inset 0 0 10px #ff0000; background-color: #ff0000; }
            33% { box-shadow: 0 0 25px #00ff00, inset 0 0 10px #00ff00; background-color: #00ff00; }
            66% { box-shadow: 0 0 25px #0000ff, inset 0 0 10px #0000ff; background-color: #0000ff; }
            100% { box-shadow: 0 0 25px #ff0000, inset 0 0 10px #ff0000; background-color: #ff0000; }
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.8); }

        .face-color-trans { transition: background-color 0.4s, box-shadow 0.4s, border-radius 0.3s ease, height 0.4s ease; }
    </style>
</head>

<body class="min-h-screen p-2 sm:p-4 flex flex-col relative selection:bg-cyan-500/30">

    <!-- LOGIN SCREEN OVERLAY (SISTEM IDENTIFIKASI) -->
    <div id="login-overlay" class="fixed inset-0 bg-[#030712] z-[10000] flex items-center justify-center transition-all duration-700">
        <div class="absolute inset-0 bg-[linear-gradient(rgba(6,182,212,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(6,182,212,0.05)_1px,transparent_1px)] bg-[length:30px_30px] z-0 pointer-events-none"></div>
        <div class="glass-panel p-8 rounded-3xl border border-cyan-500/50 shadow-[0_0_50px_rgba(6,182,212,0.2)] max-w-sm w-full relative z-10 flex flex-col items-center">
            <div class="w-20 h-20 bg-slate-900 rounded-full border-2 border-cyan-500 shadow-[0_0_20px_#06b6d4] flex items-center justify-center mb-6 relative overflow-hidden">
                <div class="absolute w-full h-1 bg-cyan-400/80 shadow-[0_0_10px_#06b6d4] animate-[scan_2s_ease-in-out_infinite_alternate]"></div>
                <i class="fa-solid fa-fingerprint text-4xl text-cyan-400"></i>
            </div>
            
            <h2 class="orbitron-font text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 mb-1">IDENTIFIKASI</h2>
            <p class="terminal-font text-[10px] text-gray-400 mb-6 tracking-widest text-center uppercase">Masukkan Callsign untuk memulai</p>
            
            <div class="w-full mb-6">
                <input type="text" id="login-username" class="w-full bg-[#050810] border border-cyan-500/50 rounded-xl px-4 py-3 text-cyan-300 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 shadow-[inset_0_0_15px_rgba(0,0,0,0.8)] transition-all terminal-font uppercase text-center font-bold tracking-widest" placeholder="NAMA KAMU..." autocomplete="off">
            </div>
            
            <button onclick="establishConnection()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3.5 rounded-xl border border-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all group overflow-hidden relative">
                <div class="absolute inset-0 bg-white/20 -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-in-out"></div>
                <span class="terminal-font tracking-widest text-xs relative z-10"><i class="fa-solid fa-bolt mr-2"></i> INITIALIZE LINK</span>
            </button>
        </div>
    </div>

    <!-- Efek Cahaya Flash -->
    <div id="flash-effect" class="fixed inset-0 bg-white z-[9999] pointer-events-none opacity-0 transition-opacity duration-75"></div>
    
    <!-- Laser Screen Filter Overlay -->
    <div id="laser-overlay" class="fixed inset-0 bg-red-600/30 z-[9998] pointer-events-none opacity-0 transition-opacity duration-150 mix-blend-screen border-[20px] border-red-500/0"></div>

    <!-- Equalizer Audio Overlay -->
    <div id="audio-wave-panel" class="fixed top-4 right-4 z-50 hidden bg-cyan-950/90 border border-cyan-500 p-2.5 rounded-xl backdrop-blur-md flex items-center gap-3 shadow-[0_0_20px_rgba(6,182,212,0.3)]">
        <i class="fa-solid fa-waveform text-cyan-400 animate-pulse"></i>
        <div class="flex gap-1 items-end h-4">
            <span class="w-1.5 bg-cyan-400 rounded-t animate-[pulse_0.3s_infinite] h-[40%]"></span>
            <span class="w-1.5 bg-cyan-400 rounded-t animate-[pulse_0.4s_infinite] h-[80%]"></span>
            <span class="w-1.5 bg-cyan-400 rounded-t animate-[pulse_0.2s_infinite] h-[100%]"></span>
            <span class="w-1.5 bg-cyan-400 rounded-t animate-[pulse_0.5s_infinite] h-[60%]"></span>
        </div>
    </div>

    <header class="w-full max-w-[1400px] mx-auto mb-4 flex flex-col lg:flex-row justify-between items-center gap-4 border-b border-cyan-500/20 pb-4 mt-2">
        <div class="flex items-center gap-5 w-full lg:w-auto">
            <div class="w-16 h-16 rounded-2xl bg-slate-900 flex items-center justify-center border-2 border-cyan-500/50 shadow-[0_0_20px_rgba(6,182,212,0.3)] relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-br from-cyan-600/20 to-purple-600/20"></div>
                <div class="absolute w-full h-1 bg-cyan-400/50 shadow-[0_0_10px_#06b6d4] animate-[scan_2s_ease-in-out_infinite_alternate]"></div>
                <i class="fa-solid fa-microchip text-cyan-300 text-3xl z-10 drop-shadow-[0_0_8px_#06b6d4]"></i>
            </div>
            <div class="flex-grow">
                <div class="flex flex-col sm:flex-row sm:items-end gap-2 mb-1">
                    <h1 class="orbitron-font text-3xl sm:text-4xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-500 drop-shadow-lg">
                        ZEKA V8.5
                    </h1>
                    <span class="px-2 py-1 rounded text-[9px] font-black bg-cyan-500/20 border border-cyan-500/50 text-cyan-300 animate-pulse mb-1 shadow-[0_0_10px_rgba(6,182,212,0.4)]">CYBERNETIC AI</span>
                </div>
                <p class="text-[11px] text-gray-400 font-bold tracking-widest uppercase terminal-font flex items-center gap-2">
                    <i class="fa-solid fa-fingerprint text-purple-500"></i> CREATOR: <span id="creator-name-display" class="text-cyan-400 glow-text">UNKNOWN</span> | SYS_STATUS: ONLINE
                </p>
            </div>
        </div>
        
        <!-- Quantum Core & Sync Dashboard -->
        <div class="flex items-center gap-4 bg-slate-900/80 p-3 rounded-2xl border border-gray-700 shadow-xl z-50 min-w-[320px]">
            <div class="flex-grow flex flex-col gap-1.5">
                <div class="flex justify-between items-center">
                    <span class="text-[9px] text-gray-400 font-bold terminal-font tracking-widest"><i class="fa-solid fa-network-wired text-purple-400"></i> NEURAL SYNC</span>
                    <span id="sync-text" class="text-xs text-purple-400 font-bold terminal-font">100%</span>
                </div>
                <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden border border-gray-700">
                    <div id="sync-bar" class="h-full bg-purple-500 shadow-[0_0_8px_#a855f7] transition-all duration-500"></div>
                </div>
                <div class="flex justify-between items-center mt-1">
                    <span class="text-[9px] text-gray-400 font-bold terminal-font tracking-widest"><i class="fa-solid fa-temperature-arrow-up text-red-400"></i> CORE TEMP</span>
                    <span id="temp-text" class="text-xs text-cyan-400 font-bold terminal-font">40°C</span>
                </div>
                <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden border border-gray-700">
                    <div id="temp-bar" class="h-full bg-cyan-500 shadow-[0_0_8px_#06b6d4] transition-all duration-500" style="width: 40%"></div>
                </div>
            </div>
            
            <button onclick="toggleOverclock()" id="btn-overclock" class="w-12 h-12 rounded-xl bg-slate-800 border border-slate-600 hover:bg-slate-700 text-gray-400 flex flex-col items-center justify-center transition-all group relative shadow-md flex-shrink-0">
                <i class="fa-solid fa-bolt group-hover:text-cyan-400 transition-colors"></i>
                <span class="text-[5px] font-bold mt-1 tracking-widest">OVRCLK</span>
                <div id="oc-indicator" class="w-full h-0.5 bg-slate-600 absolute bottom-0 rounded-b-xl transition-colors"></div>
            </button>
        </div>
    </header>

    <main class="flex-grow w-full max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch pb-10">
        
        <div class="lg:col-span-5 flex flex-col gap-5">
            
            <!-- Hologram Robot -->
            <div class="glass-panel rounded-3xl flex-grow border border-gray-700 relative overflow-hidden flex flex-col min-h-[480px]">
                <div class="absolute inset-0 bg-[linear-gradient(rgba(6,182,212,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(6,182,212,0.05)_1px,transparent_1px)] bg-[length:30px_30px] z-0 pointer-events-none"></div>
                
                <div class="flex justify-between items-center px-4 py-3 z-20 relative bg-gradient-to-b from-slate-950/90 to-transparent">
                    <span class="text-[10px] text-cyan-400 uppercase tracking-widest font-black terminal-font flex items-center gap-2 bg-cyan-950/30 px-3 py-1 rounded border border-cyan-500/30 shadow-inner">
                        <span id="ai-status-dot" class="inline-block w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></span>
                        <span id="ai-status-text">AI ACTIVE</span>
                    </span>
                    <button onclick="toggleMaintenance()" id="btn-maintenance" class="text-[9px] text-yellow-400 font-bold tracking-wider uppercase bg-yellow-950/30 hover:bg-yellow-900/50 px-3 py-1 rounded border border-yellow-600/50 transition-all flex items-center gap-1.5 shadow-[0_0_10px_rgba(234,179,8,0.2)]">
                        <i class="fa-solid fa-screwdriver-wrench"></i> MODE TEKNISI
                    </button>
                </div>

                <div class="flex-grow flex items-center justify-center relative p-6 z-10 head-perspective" id="main-robot-container">
                    <div class="holo-base"></div>

                    <!-- ORBITING COMPANION DRONE (NEW) -->
                    <div id="companion-drone" class="absolute top-1/2 left-1/2 w-8 h-8 rounded-full bg-cyan-400/20 border-2 border-cyan-400 shadow-[0_0_20px_#06b6d4] flex items-center justify-center hidden z-30 pointer-events-none">
                        <div class="w-3 h-3 bg-white rounded-full animate-pulse shadow-[0_0_10px_#fff]"></div>
                        <div class="absolute w-12 h-0.5 bg-cyan-300/50 rotate-45 animate-spin"></div>
                    </div>

                    <div class="head-inner" id="robot-head-inner">
                        
                        <!-- FRONT FACE -->
                        <div class="head-front flex items-center justify-center">
                            <div id="glow-bg" class="absolute w-[360px] h-[360px] rounded-full border border-cyan-500/20 shadow-[0_0_50px_rgba(6,182,212,0.15)] transition-colors duration-500 animate-[pulse_4s_infinite] z-0"></div>
                            
                            <div class="w-72 h-72 rounded-[3.5rem] bg-gradient-to-br from-slate-200 via-slate-400 to-slate-700 p-2.5 shadow-[0_25px_50px_rgba(0,0,0,0.8),0_0_30px_rgba(6,182,212,0.2)] relative z-10 border-t-2 border-white/80 border-b-4 border-b-slate-800">
                                <div class="absolute -top-5 left-1/2 -translate-x-1/2 w-14 h-6 bg-slate-300 rounded-t-full border-t border-x border-white/80 flex justify-center items-start shadow-xl">
                                    <div class="w-4 h-4 bg-cyan-400 rounded-full mt-0.5 shadow-[0_0_15px_#06b6d4] transition-all duration-300" id="antenna"></div>
                                </div>
                                <div class="absolute -left-3.5 top-1/2 -translate-y-1/2 w-5 h-24 bg-slate-800 rounded-l-2xl border-y border-l border-slate-500 shadow-[inset_0_0_15px_rgba(0,0,0,1)]"></div>
                                <div class="absolute -right-3.5 top-1/2 -translate-y-1/2 w-5 h-24 bg-slate-800 rounded-r-2xl border-y border-r border-slate-500 shadow-[inset_0_0_15px_rgba(0,0,0,1)]"></div>
                                <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-10 h-3 bg-slate-900 rounded border border-slate-600 shadow-[inset_0_0_10px_#000] flex justify-center gap-1.5 p-0.5">
                                    <div class="w-1.5 h-full bg-black rounded-sm"></div>
                                    <div class="w-1.5 h-full bg-black rounded-sm"></div>
                                </div>

                                <div class="w-full h-full bg-slate-950 rounded-[3rem] relative flex flex-col justify-center items-center overflow-hidden border-[8px] border-slate-800 shadow-[inset_0_0_60px_rgba(0,0,0,1)] z-10 cursor-pointer" id="face-screen">
                                    <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[length:100%_4px] pointer-events-none z-20 mix-blend-overlay"></div>
                                    <div class="absolute inset-0 bg-gradient-to-br from-white/10 via-transparent to-transparent h-2/3 rounded-t-[3rem] pointer-events-none z-20"></div>

                                    <div id="face-physics-wrapper" class="relative z-10 flex flex-col items-center w-full h-full justify-center">
                                        <div id="cheek-left" class="absolute w-12 h-6 rounded-full filter blur-[12px] opacity-0 transition-opacity duration-500 pointer-events-none" style="top: 45%; left: 10%;"></div>
                                        <div id="cheek-right" class="absolute w-12 h-6 rounded-full filter blur-[12px] opacity-0 transition-opacity duration-500 pointer-events-none" style="top: 45%; right: 10%;"></div>

                                        <div id="tear-right" class="absolute w-2 h-4 bg-blue-400 rounded-full opacity-0 filter drop-shadow-[0_0_5px_#60a5fa] pointer-events-none transition-all duration-300" style="top: 40%; right: 30%;"></div>

                                        <div class="flex gap-14 mb-10 relative items-center justify-center h-20 w-full" id="eyes-container">
                                            <div class="w-12 h-16 bg-cyan-400 rounded-full shadow-[0_0_25px_currentColor] face-color-trans origin-center relative" id="left-eye">
                                                <div class="dead-x absolute inset-0 hidden items-center justify-center text-red-500 font-bold text-3xl pointer-events-none">X</div>
                                            </div>
                                            <div class="w-12 h-16 bg-cyan-400 rounded-full shadow-[0_0_25px_current
